name: Build CUDA server image (fork)

on:
  workflow_dispatch:
    inputs:
      cuda_arch:
        description: 'CUDA architectures: 75 = Turing, 120 = Blackwell (RTX 50xx / RTX PRO 6000)'
        default: "75;120"
  push:
    branches: [laguna]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  contents: read
  packages: write

# A new push cancels the build still running for the previous one
concurrency:
  group: build-cuda-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: llama.cpp-laguna

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image name and source commit
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server-cuda image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devops/cuda.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          build-args: |
            CUDA_VERSION=12.8.1
            CUDA_DOCKER_ARCH=${{ inputs.cuda_arch || '75;120' }}
          tags: |
            ${{ steps.vars.outputs.image }}:server-cuda
            ${{ steps.vars.outputs.image }}:server-cuda-${{ steps.vars.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
          cache-from: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache,mode=max
